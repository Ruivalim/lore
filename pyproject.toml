[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lore"
dynamic = ["version"]
description = "A curated personal knowledge base you query in natural language, that learns from the questions it cannot answer yet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rui Valim" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["knowledge-base", "markdown", "cli", "llm", "rag", "notes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Ruivalim/lore"
Issues = "https://github.com/Ruivalim/lore/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
lore = "lore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lore.__version__" }

[tool.setuptools.package-data]
lore = ["config.example.toml", "templates/*.md", "seed/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
