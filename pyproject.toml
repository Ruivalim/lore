[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lore"
version = "0.0.1"
description = "Biblioteca pessoal curada, consultável por linguagem natural"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lore = "lore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
